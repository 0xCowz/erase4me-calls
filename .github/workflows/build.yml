name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generer le projet Xcode
        run: xcodegen generate --spec project.yml

      - name: Compiler (Release, sans signature)
        run: |
          xcodebuild -project Erase4meCalls.xcodeproj -scheme Erase4meCalls \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verifier que l'extension est dans l'app
        run: |
          APP="build/Build/Products/Release-iphoneos/Erase4meCalls.app"
          ls "$APP/PlugIns" && ls "$APP/PlugIns/Blocker.appex" | head -20

      - name: Empaqueter l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Erase4meCalls.app Payload/
          zip -qr Erase4meCalls-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Erase4meCalls-ipa
          path: Erase4meCalls-unsigned.ipa
          retention-days: 30
