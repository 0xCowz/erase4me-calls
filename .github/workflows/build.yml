name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Generer le projet Xcode
        run: xcodegen generate --spec project.yml

      - name: Compiler (Release, sans signature)
        run: |
          set -o pipefail
          xcodebuild -project Erase4meCalls.xcodeproj -scheme Erase4meCalls \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log

      - name: Erreurs de compilation (annotations lisibles publiquement)
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r l; do
            l="${l//%/%25}"
            echo "::error::${l}"
          done

      - name: Verifier le contenu de l'app
        run: |
          APP="build/Build/Products/Release-iphoneos/Erase4meCalls.app"
          ls "$APP/PlugIns"
          for n in Blocker1 Blocker2; do
            test -f "$APP/PlugIns/$n.appex/ranges.json" || { echo "ranges.json absent de $n"; exit 1; }
          done
          test -f "$APP/blocks.json" || { echo "blocks.json absent de l'app"; exit 1; }
          test -f "$APP/Assets.car" || { echo "catalogue d'assets absent"; exit 1; }

      - name: Empaqueter l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Erase4meCalls.app Payload/
          zip -qr Erase4meCalls-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Erase4meCalls-ipa
          path: Erase4meCalls-unsigned.ipa
          retention-days: 30
